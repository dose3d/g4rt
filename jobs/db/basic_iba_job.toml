[RunSvc]
JobName = "TestowaIba"
BeamType = "IAEA"
PhspInputFileName = "/mnt/e/TrueBeam" 
PhspEvtVrtxMultiplicityTreshold = 1
PrintProgressFrequency = 0.001
Physics = "LowE_Penelope" #  "LowE_Livermore" "LowE_Penelope" "emstandard_opt3"
GenerateCT = false
PrimariesAnalysis = false
NTupleAnalysis = true
RunAnalysis = true

[GeoSvc]
BuildLinac = true
BuildPatient = true

[PatientGeometry]
Type = "D3DDetector"
PatientIsocentreX = 0.0
PatientIsocentreY = 0.0
PatientIsocentreZ = 0.0
EnviromentSizeX = 900.0
EnviromentSizeY = 900.0
EnviromentSizeZ = 500.0
EnviromentMedium = "Usr_G4AIR20C"
EnviromentPatientEnvelop = "IbaImRT_3mf" # Simplified iba Im'RT model
PatientDBPath = "dose3d/geo/IBA_ImRT/IBA_Modular" # TODO: If this exist -> read this and load 


[D3DDetector_Cell]
TranslationInLocalFrame = [0.00,0.00,0.00] # In mm | 21.12.2024 testbeam (by my conclusion it should be 
Medium = "RMPS470" #G4_WATER, PMMA
Voxelization = [5,5,5]

[RunSvc_Plan] # paths can be relative (to PROJECT_DATA) or absolute
nControlPoints = 1      # This will limit number of ctrl points defined below!
BeamRotation = 0        # This will overwrite Rotation value for all below plan files!
nParticles = 5000      # This will overwrite Rotation value for all below plan files!
PlanInputFile = [
        "plan/custom/cp10x10.dat"
        # "plan/custom/prostate/prostate_imrt_beam0_cp0.dat"
]
