PhspEvtVrtxMultiplicityTreshold = 45
PrintProgressFrequency = 0.001
Physics = "LowE_Penelope" #  "LowE_Livermore" "LowE_Penelope" "emstandard_opt3"
EnableExtraProcesses = false

GenerateCT = false
PrimariesAnalysis = false
NTupleAnalysis = false
RunAnalysis = true

WriteFieldMaskToCsv = true

StoreTracks= false
StorePositions= false
StoreEnergies = false
StorePrimaries = false
StoreRunInfo= false
MinimalMode= true

[GeoSvc]
BuildLinac = true
BuildPatient = true
MlcModel="Simplified"

[PatientGeometry]
Type = "D3DDetector"
PatientIsocentreX = 0.0
PatientIsocentreY = 0.0
PatientIsocentreZ = 0.0
EnviromentSizeX = 64.0
EnviromentSizeY = 64.0
EnviromentSizeZ = 64.0
EnviromentMedium = "Usr_G4AIR20C"

# Optional dose grid overlaying the complete patient environment, including
# D3D cells and every other daughter volume. Zero Size values derive the
# extent and centre from [PatientGeometry].
[ParallelWorldDoseScorer]
Enabled = true
SizeX = 0.0
SizeY = 0.0
SizeZ = 0.0
CentreX = 0.0
CentreY = 0.0
CentreZ = 0.0
VoxelSizeX = 0.5
VoxelSizeY = 0.5
VoxelSizeZ = 1.0
CollectionName = "ParentWorldDose"

[D3DDetector_Detector]
TranslationInLocalFrame = [0.0,0.0,-44.0]
Voxelization = [4,4,4]

[D3DDetector_Cell]
Medium = "RMPS470"
Voxelization = [10,10,10]
TracksAnalysis = false
CellVoxelisedScorer = true

[RunSvc_Plan]
nParticles = 2000000
PlanInputFile = [
        "plan/custom/cp10x10.dat"
]
